# Engine registry — production HF model ids for real System-1 serving
version: 1
partners:
  stage2_partner_id: clm-8b
  stage1_partner_id: anyjev-l0

engines:
  - config_id: anyjev-l0
    family: anyjev
    display_name: AnyJev L0 (Decision-2.0 on Qwen3-class)
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/anyjev
    # Until AnyJev runtime is packaged, real mode uses Decision-2.0 Lux as Choice engine
    weights_ref: ${ANYJEV_WEIGHTS:-vllm-sr/Decision-2.0-Lux-9B}
    model_revision: anyjev-l0
    backend: decision20

  - config_id: anyjev-l1
    family: anyjev
    display_name: AnyJev L1 (calibrated)
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: configs/calibration/anyjev_l1_heldout.json
    container_ref: containers/anyjev
    weights_ref: ${ANYJEV_WEIGHTS:-vllm-sr/Decision-2.0-Lux-9B}
    model_revision: anyjev-l1
    backend: decision20

  - config_id: clm-8b
    family: clm
    display_name: CLM-8B Action Cache
    primitives: [score, action_cache]
    primary_stages: [stage2]
    base_url: http://localhost:8001
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/clm-8b
    weights_ref: ${CLM8B_WEIGHTS:-Contrastive-LM/CLM-v0.1-8B}
    model_revision: clm-8b
    backend: clm

  - config_id: decision20-kai
    family: vllm-sr
    display_name: Decision-2.0 Kai-0.6B
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/vllm-sr
    weights_ref: ${DECISION20_KAI_WEIGHTS:-vllm-sr/Decision-2.0-Kai-0.6B}
    model_revision: decision20-kai-0.6b
    backend: decision20

  - config_id: decision20-lux
    family: vllm-sr
    display_name: Decision-2.0 Lux-9B
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/vllm-sr
    weights_ref: ${DECISION20_LUX_WEIGHTS:-vllm-sr/Decision-2.0-Lux-9B}
    model_revision: decision20-lux-9b
    backend: decision20

  - config_id: laya-modernbert
    family: laya
    display_name: Laya ModernBERT decision
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: false
    is_light_edge: true
    calibration_ref: null
    container_ref: containers/laya
    weights_ref: ${LAYA_WEIGHTS:-ameerhmz5/laya-modernbert-decision-90pct}
    model_revision: laya-modernbert-421m
    backend: embed_rank

  - config_id: ar-qwen3-8b-instruct
    family: ar-baseline
    display_name: AR Qwen3-8B-Instruct
    primitives: [json_choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/ar-qwen3-instruct
    weights_ref: ${AR_QWEN3_WEIGHTS:-Qwen/Qwen3-8B-Instruct}
    model_revision: qwen3-8b-instruct
    backend: ar_json

# Architecture-true Stage-1 Choice × Stage-2 Score pairs (see README).
# Default `run_benchmark.py --real` runs required rows; L1 is added when
# configs/calibration/anyjev_l1_heldout.json exists; AR needs --include-baseline.
matrix_pairs:
  - pair_id: lux-clm
    stage1: decision20-lux
    stage2: clm-8b
    role: production
    rationale: >
      Strongest open Choice head (Lux, 16k context) with CLM Action Cache for
      enumerated chunk scoring. Primary FinAgentBench production pair.

  - pair_id: anyjev-l0-clm
    stage1: anyjev-l0
    stage2: clm-8b
    role: calibrated
    rationale: >
      AnyJev L0 cyclic permutation cancels option-order bias on the K=5 filing-type
      Choice. CLM remains the Stage-2 scorer.

  - pair_id: anyjev-l1-clm
    stage1: anyjev-l1
    stage2: clm-8b
    role: calibrated
    optional: true
    requires_calibration: true
    rationale: >
      AnyJev L1 temperature scaling over 200 held-out ids. Skipped until
      configs/calibration/anyjev_l1_heldout.json is present.

  - pair_id: kai-clm
    stage1: decision20-kai
    stage2: clm-8b
    role: latency
    rationale: >
      Kai-0.6B bidirectional encoder is a sub-5 ms S1 router; 1,024-token budget
      is enough for five doc-type labels. Do not use Kai as Stage 2.

  - pair_id: laya-clm
    stage1: laya-modernbert
    stage2: clm-8b
    role: latency
    rationale: >
      Laya ModernBERT is the edge/CPU Choice baseline (512-token cap). Pair with
      CLM so Stage 2 is not truncated.

  - pair_id: lux-lux
    stage1: decision20-lux
    stage2: decision20-lux
    role: long_context
    rationale: >
      Same Lux Score heads on both stages so Stage-2 chunks can use the 16k
      window (CLM is capped at 2,048 tokens). One process serves both stages.

  - pair_id: ar-clm
    stage1: ar-qwen3-8b-instruct
    stage2: clm-8b
    role: baseline
    optional: true
    rationale: >
      Autoregressive JSON Choice anti-pattern (parse failures, uncalibrated
      verbal confidence). Off by default; enable with --include-baseline.

ports:
  stage1_default: 8000
  stage2_default: 8001
  alternate_choice: 8002

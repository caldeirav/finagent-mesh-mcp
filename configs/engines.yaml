  - config_id: noop-choice
    family: noop
    display_name: No-op Choice (collapsed-stage placeholder)
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8700
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: false
    is_light_edge: true
    calibration_ref: null
    container_ref: ""
    weights_ref: ""
    model_revision: noop
    backend: noop_inprocess

# Paper matrix: Block A (Choice×Lux Score) + Block B (Lux Choice×Score).
# Default --real runs optional=false only; --include-optional adds shortlist + one-shot.
# Deferred (not runnable): lux-clm-ft (#1), lux-e5-ce (#2)
matrix_pairs:
  - pair_id: lux-lux
    stage1: decision20-lux
    stage2: decision20-lux
    blocks: [A, B]
    role: long_context
    optional: false
    rationale: >
      Primary System-1 pipeline; shared physical run for both Block A and Block B.

  - pair_id: anyjev-l0-lux
    stage1: anyjev-l0
    stage2: decision20-lux
    blocks: [A]
    role: calibrated
    optional: false
    rationale: Order-debiased Choice on Lux backbone; report option-flip rate (OFR).

  - pair_id: kai-lux
    stage1: decision20-kai
    stage2: decision20-lux
    blocks: [A]
    role: latency
    optional: false
    rationale: Sub-5 ms Kai Choice router × long-context Lux Score.

  - pair_id: laya-lux
    stage1: laya-modernbert
    stage2: decision20-lux
    blocks: [A]
    role: latency
    optional: false
    rationale: Edge Choice × long-context Lux Score.

  - pair_id: ar-lux
    stage1: ar-qwen3-8b-instruct
    stage2: decision20-lux
    blocks: [A]
    role: baseline
    optional: false
    rationale: Generative JSON Choice baseline; parse failures counted.

  - pair_id: lux-clm
    stage1: decision20-lux
    stage2: clm-8b
    blocks: [B]
    role: production
    optional: false
    rationale: Dual-encoder Action Cache zero-shot Score.

  - pair_id: lux-bm25
    stage1: decision20-lux
    stage2: bm25-stage2
    blocks: [B]
    role: ir_floor
    optional: false
    rationale: Lexical BM25 passage floor.

  - pair_id: lux-e5
    stage1: decision20-lux
    stage2: e5-base
    blocks: [B]
    role: ir_dense
    optional: false
    rationale: General-domain E5 bi-encoder dense Score.

  - pair_id: lux-clm-shortlist
    stage1: decision20-lux
    stage2: clm-shortlist-32
    blocks: [B]
    role: optional
    optional: true
    rationale: BM25 top-32 then CLM Score.

  - pair_id: one-shot-ar
    stage1: noop-choice
    stage2: ar-qwen3-8b-instruct
    blocks: [B]
    role: baseline_collapsed
    optional: true
    collapsed_stages: true
    rationale: >
      One-shot generative ranking of all chunks; collapses two-stage contract;
      labeled baseline only.

  # Calibration-gated (not required for Block A); kept for compatibility
  - pair_id: anyjev-l1-lux
    stage1: anyjev-l1
    stage2: decision20-lux
    blocks: [A]
    role: calibrated
    optional: true
    requires_calibration: true
    rationale: AnyJev L1 temperature scaling; skipped until 200-id calibration file is ready.

deferred_pairs:
  - pair_id: lux-clm-ft
    issue: https://github.com/caldeirav/finagent-mesh-mcp/issues/1
    rationale: Trained dual-encoder heads on held-out FinAgentBench split.
  - pair_id: lux-e5-ce
    issue: https://github.com/caldeirav/finagent-mesh-mcp/issues/2
    rationale: Dense shortlist then cross-encoder Stage-2 ceiling.

ports:
  stage1_default: 8000
  stage2_default: 8001
  alternate_choice: 8002

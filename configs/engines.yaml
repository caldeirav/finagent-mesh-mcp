# Engine registry contract (configs/engines.yaml shape)
# Consumers: matrix runner, serve_engine.sh, OpenDecisionClient adapters

version: 1
partners:
  stage2_partner_id: clm-8b
  stage1_partner_id: anyjev-l0

engines:
  - config_id: anyjev-l0
    family: anyjev
    display_name: AnyJev L0 (Qwen3-8B)
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/anyjev
    weights_ref: ${ANYJEV_WEIGHTS}
    model_revision: anyjev-l0

  - config_id: anyjev-l1
    family: anyjev
    display_name: AnyJev L1 (Qwen3-8B)
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: configs/calibration/anyjev_l1_heldout.json
    container_ref: containers/anyjev
    weights_ref: ${ANYJEV_WEIGHTS}
    model_revision: anyjev-l1

  - config_id: clm-8b
    family: clm
    display_name: CLM-8B Action Cache
    primitives: [score, action_cache]
    primary_stages: [stage2]
    base_url: http://localhost:8001
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/clm-8b
    weights_ref: ${CLM8B_WEIGHTS}
    model_revision: clm-8b

  - config_id: decision20-kai
    family: vllm-sr
    display_name: Decision-2.0 Kai-0.6B
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/vllm-sr
    weights_ref: ${DECISION20_KAI_WEIGHTS}
    model_revision: decision20-kai-0.6b

  - config_id: decision20-lux
    family: vllm-sr
    display_name: Decision-2.0 Lux-9B
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/vllm-sr
    weights_ref: ${DECISION20_LUX_WEIGHTS}
    model_revision: decision20-lux-9b

  - config_id: laya-modernbert
    family: laya
    display_name: Laya ModernBERT 421M
    primitives: [choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: false
    is_light_edge: true
    calibration_ref: null
    container_ref: containers/laya
    weights_ref: ${LAYA_WEIGHTS}
    model_revision: laya-modernbert-421m

  - config_id: ar-qwen3-8b-instruct
    family: ar-baseline
    display_name: AR Qwen3-8B-Instruct
    primitives: [json_choice]
    primary_stages: [stage1]
    base_url: http://localhost:8000
    health_path: /healthz
    decide_path: /v1/systemone
    is_heavy_gpu: true
    is_light_edge: false
    calibration_ref: null
    container_ref: containers/ar-qwen3-instruct
    weights_ref: ${AR_QWEN3_WEIGHTS}
    model_revision: qwen3-8b-instruct

# Port collision rule when variable engine is clm-8b:
# stage1 partner anyjev-l0 → :8000; clm-8b → :8001
# Optional alternate Choice partner port: :8002
ports:
  stage1_default: 8000
  stage2_default: 8001
  alternate_choice: 8002

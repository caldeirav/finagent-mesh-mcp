[project]
name = "finagent-mesh-mcp"
version = "0.1.0"
description = "Hybrid financial agent architecture and benchmark harness using LangGraph, MCP tooling, and FinAgentBench."
authors = [
    { name = "Vincent Caldeira", email = "vincent.caldeira@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "mcp>=2.3.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.optional-dependencies]
engines = [
    "transformers>=5.18.0",
]
real = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
    "rank-bm25>=0.2.2",
    "safetensors>=0.8.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.14.1",
    "transformers>=5.17",
]
# Parallel Unsloth decision-Score track (006). Not required for default --real matrix.
#
# Do NOT list the PyPI `unsloth` package here: on aarch64 / DGX Spark (GB10) it
# pulls `xformers`, which has no wheel and fails to build. Install Unsloth itself
# with --no-deps via:  bash scripts/install_unsloth_zgx.sh
# (NVIDIA Spark pattern: pip install --no-deps unsloth unsloth_zoo bitsandbytes)
unsloth = [
    "accelerate>=1.15.0",
    "bitsandbytes",
    "datasets>=3.0.0",
    "huggingface-hub>=1.33.0",
    "peft",
    "protobuf",
    "safetensors>=0.8.0",
    "sentencepiece",
    "torch>=2.14.1",
    # Qwen3.8 FastDecisionModel load path expects vision processors even for text Score
    "torchvision",
    "transformers>=4.57.0",
    "trl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Use only uv-managed CPython from `.python-version` (no conda/system interpreters).
python-preference = "only-managed"
package = true
# If anything still requests xformers, do not try to build broken aarch64 sources.
# Unsloth uses PyTorch SDPA when xformers is absent.
override-dependencies = [
    "xformers ; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finagent_mesh"]

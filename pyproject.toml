[project]
name = "finagent-mesh-mcp"
version = "0.1.0"
description = "Hybrid financial agent architecture and benchmark harness using LangGraph, MCP tooling, and FinAgentBench."
authors = [
    { name = "Vincent Caldeira", email = "vincent.caldeira@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "mcp>=2.3.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.optional-dependencies]
engines = [
    "transformers>=5.18.0",
]
real = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
    "rank-bm25>=0.2.2",
    "safetensors>=0.8.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.14.1",
    "transformers>=5.17",
]
# Parallel Unsloth decision-Score track (006). Entire stack via uv:
#   uv sync --extra real --extra unsloth
#
# Overrides (see [tool.uv] below):
# - drop xformers (optional; SDPA on GB10 / aarch64)
# - keep transformers>=5.18 (validated with Unsloth 2026.10.3; PyPI upper-bound is stale)
unsloth = [
    "unsloth>=2026.10.3",
    "unsloth-zoo>=2026.10.3",
    "torch>=2.14.1",
    "torchvision",
    "triton ; sys_platform == 'linux'",
    "accelerate>=1.15.0",
    "bitsandbytes!=0.46.0,!=0.48.0,>=0.45.5",
    "datasets>=3.4.1,<5.0.0,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0",
    "diffusers",
    "hf-transfer",
    "huggingface-hub>=0.34.0",
    "peft>=0.18.0,!=0.11.0",
    "protobuf",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.0",
    "transformers>=5.18.0",
    "trl>=0.18.2,!=0.19.0,<=1.13.0",
    "cut-cross-entropy",
    "msgspec",
    "nest-asyncio",
    "pillow",
    "psutil",
    "rich",
    "structlog>=24.1.0",
    "torchao>=0.13.0",
    "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"
package = true
# This repo targets ZGX Nano / DGX Spark (and optional x86_64 Linux CI).
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    # Unsloth marks xformers optional for aarch64 already; force-skip everywhere here.
    "xformers ; sys_platform == 'never'",
    # Unsloth metadata caps transformers<=5.17; 5.18 is what this repo runs successfully.
    "transformers>=5.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finagent_mesh"]

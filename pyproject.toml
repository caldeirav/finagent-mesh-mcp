[project]
name = "finagent-mesh-mcp"
version = "0.1.0"
description = "Hybrid financial agent architecture and benchmark harness using LangGraph, MCP tooling, and FinAgentBench."
authors = [
    { name = "Vincent Caldeira", email = "vincent.caldeira@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "mcp>=2.3.0",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.optional-dependencies]
engines = [
    "transformers>=5.18.0",
]
real = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Use only uv-managed CPython from `.python-version` (no conda/system interpreters).
python-preference = "only-managed"
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finagent_mesh"]
